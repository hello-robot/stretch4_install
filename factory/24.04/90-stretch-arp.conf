# Stretch internal network: keep each IP address on its own interface.
#
# The NUC holds 192.168.1.2 on the internal Ethernet (lidars + Jetson). By
# default Linux answers ARP for any of its addresses on any interface, so if
# the customer's Wi-Fi is also 192.168.1.0/24, the robot would answer "who has
# 192.168.1.2?" on Wi-Fi and steal traffic meant for a real device at that
# address.
#
# arp_ignore=1:   only reply to ARP if the asked-for IP is on the interface the
#                 request arrived on.
# arp_announce=2: when sending ARP requests, always use the outgoing
#                 interface's own IP as the source, never another interface's.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
