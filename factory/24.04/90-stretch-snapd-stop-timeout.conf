# Stretch: cap how long shutdown waits for snapd.
#
# When the robot goes to sleep or shuts down, the power button pulses yellow
# until the NUC has powered off, so a slow OS shutdown keeps the user waiting.
# snapd normally stops in about 3 s. In the first minute after a boot, though,
# it is busy with network calls to the snap store. Once shutdown has taken the
# network down, it waited 52 s for those calls to fail before exiting, and the
# whole shutdown waited with it.
#
# With this, systemd kills snapd if it hasn't stopped after 10 s. snapd keeps
# its state on disk and picks up unfinished work after the next boot.
#
# Installed to /etc/systemd/system/snapd.service.d/
[Service]
TimeoutStopSec=10s
